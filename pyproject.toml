[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation library (perfect and Pac-Man style mazes)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Ahmad AL-Quraan" },
    { name = "Alhareth Tahtamoni" }
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mazegen*"]
